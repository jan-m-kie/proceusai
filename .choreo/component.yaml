# .choreo/component.yaml
# +required The configuration file schema version
schemaVersion: 1.2

# +optional Incoming connection details for the component
endpoints:
  - name: proceus-ai-api
    displayName: Proceus AI Vision API
    service:
      basePath: /proceus-api
      port: 9090
    type: REST
    networkVisibilities:
      - Public
      - Organization

# Removed the entire 'dependencies' section for now.
# You can add it back later if you need to define connections.

# +optional Defines runtime configurations
configurations:
  env:
    - name: FLASK_ENV
      valueFrom:
        configForm:
          displayName: Flask Environment
          required: false
          type: string
          defaultValue: "development"
          
  # +optional List of files to be injected into the component from config form
